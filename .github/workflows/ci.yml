name: Gaming smoke and LINK observer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test observer without private data
        run: node --test tests/*.test.mjs
      - name: Build Cloudflare Worker bundle
        run: npm run build
      - name: Validate frontend and Worker
        run: npm run check && node --check nexus-sync.js
      - name: Verify push backend preserved
        run: |
          grep -q "pushRouter" worker.mjs
          grep -q "link-audit.js?v=0120" worker.mjs
          grep -q "deliverDue" worker.mjs
          grep -q 'app.js?v=0120' worker.mjs
          grep -q 'nexus-sync.js?v=0130' worker.mjs
          grep -q 'link-hub-adapter.js?v=0131' worker.mjs
